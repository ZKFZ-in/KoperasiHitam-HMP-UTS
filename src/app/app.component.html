<ion-app [class.dark]="theme.isDarkMode">
  
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list lines="none">
        <ion-menu-toggle>
          <ion-item class="background ion-margin-bottom" lines="none" routerLink="/home">
            <ion-icon name="home" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
          <ion-item class="background ion-margin-bottom" lines="none" routerLink="/about">
            <ion-icon name="help-circle-outline" slot="start"></ion-icon>
            <ion-label>About App</ion-label>
          </ion-item>
          <ion-item class="background ion-margin-bottom" lines="none" routerLink="/settings">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-item>
          <ion-item class="background ion-margin-bottom" lines="none" routerLink="/logout">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  
  <ion-router-outlet id="main-content"></ion-router-outlet>

  
  <ion-tabs *ngIf="!isLoginPage">
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" routerLink="/home">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="Produk" routerLink="/produk">
        <ion-icon name="cube-outline"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="Transaksi" routerLink="/transaksi">
        <ion-icon name="receipt-outline"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="Profile" routerLink="/profil">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
