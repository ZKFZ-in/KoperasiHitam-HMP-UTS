<ion-app [class.dark]="theme.isDarkMode">
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle>
          <ion-list>
            <ion-item routerLink="/home">
              <ion-icon name="home" slot ="start"></ion-icon>
              <ion-label>Dashboard</ion-label>
            </ion-item>
          </ion-list>
          <ion-list>
            <ion-item routerLink="/produk" menuClose>
              <ion-icon name="cube-outline" slot="start"></ion-icon>
              <ion-label>Produk</ion-label>
            </ion-item>
            <ion-item routerLink="/transaksi" menuClose>
              <ion-icon name="receipt-outline" slot="start"></ion-icon>
              <ion-label>Transaksi</ion-label>
            </ion-item>
            <ion-item routerLink="/profil" menuClose>
              <ion-icon name="person-outline" slot="start"></ion-icon>
              <ion-label>Profil</ion-label>
            </ion-item>
          </ion-list>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>


  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" routerLink="/home">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>
      
      <ion-tab-button tab="about" routerLink="/about">
        <ion-icon name="help-circle-outline"></ion-icon>
        <ion-label>About App</ion-label>
      </ion-tab-button>
      
      <ion-tab-button tab="settings" routerLink="/settings">
        <ion-icon name="settings"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="logout" routerLink="/logout">
        <ion-icon name="log-out-outline"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
