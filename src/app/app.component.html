<ion-app>

  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item routerLink="/about" menuClose>
          <ion-icon name="about" slot="start"></ion-icon>
          <ion-label>About App</ion-label>
        </ion-item>
        <ion-item routerLink="/settings" menuClose>
          <ion-icon name="settings" slot="start"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-item>
        <ion-item routerLink="/logout" menuClose>
          <ion-icon name="logout" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>


  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" href="/home">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="produk" href="/produk">
        <ion-icon name="cube-outline"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="transaksi" href="/transaksi">
        <ion-icon name="receipt-outline"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profil" href="/profil">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
