<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>Produk</ion-title>

    <!-- Tombol Tambah Produk -->
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" routerLink="/tambah-produk">
        <ion-icon name="add" slot="start"></ion-icon>
        Tambah Produk
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Pencarian Produk Real-Time (tanpa tombol submit) -->
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="kataKunci"
      [debounce]="0"
      placeholder="Cari nama produk..."
      [showClearButton]="'focus'"
      inputmode="search">
    </ion-searchbar>

    <!-- Tombol Keranjang -->
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" routerLink="/keranjang">
        <ion-icon name="cart-outline" slot="start"></ion-icon>
        Keranjang
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="myProduk" [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Daftar Produk -->
  <ion-list lines="full">
    <ion-item *ngFor="let item of produkTerfilter">

      <ion-label [routerLink]="['/detail-produk', item.id]" button>
        <h2><b>{{ item.nama }}</b></h2>
        <p>
          Harga: Rp {{ item.hargaJual | number }} | Stok: {{ item.stok }} |
          <b>Terjual: {{ item.terjual || 0 }}</b>
        </p>
      </ion-label>

      <!-- Tombol Edit Produk -->
      <ion-button slot="end" fill="solid" color="warning" [routerLink]="['/edit-produk', item.id]">
        <ion-icon name="create-outline" slot="start"></ion-icon>
        Edit
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Pesan jika hasil pencarian kosong -->
  <div class="ion-text-center ion-padding" *ngIf="kataKunci.trim() && produkTerfilter.length === 0">
    <ion-icon name="search-outline" size="large"></ion-icon>
    <p>Produk "<b>{{ kataKunci }}</b>" tidak ditemukan.</p>
  </div>
</ion-content>
