<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="full">
    <ion-item *ngFor="let item of daftarProduk" [routerLink]="['/detail-produk', item.id]" button>
      <ion-label>
        <h2><b>{{ item.nama }}</b></h2>
        <p>Harga: Rp {{ item.hargaJual | number }} | Stok: {{ item.stok }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
